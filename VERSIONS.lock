[image.live_fleet]                # what the two Sparks ACTUALLY run (docker inspect, 2026-10-01, both ranks)
tag: myllmbox/qwen38-flash-next-cluster-vllm:v6-spinfix-hermes
local_image_id: sha256:175ef015947f2ee4f9babc61594d44a2c82aebf6d11d6328c10f17ed5c5ccaa1          # IDENTICAL on head and worker
built_from: myllmbox/qwen38-flash-next-cluster-vllm:v6-spinfix                                   # LABEL mbx.base
delta: patches/hermes-chat.patch — honours a top-level {"reasoning": {"enabled","effort"}} object and
       makes an OMITTED temperature greedy (0) on the chat path. Applied to
       /usr/local/lib/python3.12/dist-packages/vllm/entrypoints/openai/chat_completion/protocol.py;
       both edits asserted at build time against $PT. LABEL mbx.hermes_chat.
NOT_REPRODUCIBLE_HERE: true       # this repo has NO patches/ directory and docker/spinfix/Dockerfile applies
                                  # only the busy_loop_s sed. run.sh's ensure_image would BUILD the
                                  # v6-spinfix-hermes TAG from that Dockerfile and silently produce an
                                  # image WITHOUT the hermes-chat patch — same tag, different engine.
                                  # Do NOT set server.image to v6-spinfix-hermes until the patch is
                                  # vendored here. Upstream myllmbox carries patches/hermes-chat.patch
                                  # (47 lines, commit 4e4747b) with a patches: opt-in in recipe.yaml.
registry_status: not on Docker Hub (verified 2026-10-01: hub v2 tag lookup MISSING); ghcr.io/tysais
                 needs auth. Present only as a local build on both Sparks.

