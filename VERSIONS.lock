[hosts]                            # both Sparks
kernel: 6.17.0-1031-nvidia
nvidia_driver: 580.173.02
os_updates: disabled               # APT::Periodic::Unattended-Upgrade "0"; 6 kernel/driver packages apt-mark hold
cpu_pinning: "--cpuset-cpus 5-9,15-19"   # the 10 Cortex-X925 3.9GHz cores (0-4,10-14 are 2.8GHz A725)
fabric: 203.0.113.2 (head) <-> 203.0.113.1 (worker) — link-local point-to-point on the ConnectX cable (vendor reference layout), iface enp1s0f1np1, HCA rocep1s0f1, RoCE v2 GID index 3 (probed at launch)

[serve]
ports: { api: 8888, host_binding: 0.0.0.0, rendezvous: 25000 }
tensor_parallel: 2                 # head = rank 0 (API), worker = rank 1 (--headless)
seats: 12                          # max-num-seqs (fleet setting; upstream default in recipe.yaml is 64)
kv_cache_memory_bytes: 41000000000 # per box
restart_policy: none               # containers do NOT survive a host reboot — ./start.sh (or ./run.sh) after every reboot

[deviations]                       # everything the live fleet does differently from a stock ./run.sh of this repo
- image: v6-spinfix (self-built by run.sh from docker/spinfix/) instead of registry v6 — busy_loop_s 1 -> 0.002 in vllm shm_broadcast; SoC temp fix, zero throughput cost (see TysAIs/gb10-vllm-ops)
- port: 8888 (upstream example default is 8000) — set in recipe.yaml, .env PORT default here matches
- host: 0.0.0.0 — API exposed on the LAN, not loopback
- served-model-name: qwen3.8-flash-next (upstream example: Qwen/Qwen3.8-Flash-Next-Uncensored)
- max-num-seqs: 12 — fleet is latency-first for chat agents; 64 is the throughput-first upstream default
- cluster.env written by hand (fabric IPs match the vendor reference layout); setup.sh would produce the same file interactively
- vm.compaction_proactiveness is still the 20 default on both boxes — ./tune-host.sh was NOT applied; expect ~10% periodic stalls (see KNOWN-ISSUES.md)
