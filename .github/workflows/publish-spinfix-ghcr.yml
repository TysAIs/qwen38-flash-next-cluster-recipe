name: publish-spinfix-ghcr

# Publishes the GB10 CPU spin-wait fix image (docker/spinfix/) to ghcr.io/TysAIs.
#
# Why this exists: the spinfix image is a one-line sed over the public v6 base
# (busy_loop_s: 1 -> 0.002 in vllm/distributed/device_communicators/shm_broadcast.py).
# run.sh can always rebuild it from source, so ghcr is a convenience -- it lets
# pull-everyone boxes skip the build. Nothing here is required for a working fleet.
#
# No PAT is needed: the workflow authenticates to ghcr with the automatic
# GITHUB_TOKEN, which carries `packages: write` for the owning org/user.
# That only works because this repo is PUBLIC and Actions is enabled.
#
# Two publish paths (workflow_dispatch input `source`):
#   local   (default) -- tag + push an image that already exists on a self-hosted
#                        runner. Preserves the exact image id the fleet was
#                        verified against (byte-identical, no rebuild risk).
#                        Requires a registered self-hosted ARM64 runner.
#   rebuild           -- build docker/spinfix/ from the public v6 base and push.
#                        Runs on a GitHub-hosted ARM64 runner; needs no runner
#                        registration. Produces a functionally identical image
#                        but NOT the same image id as `local`.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "local = push the image already on the runner; rebuild = build from docker/spinfix/"
        required: true
        default: local
        type: choice
        options: [local, rebuild]
      local_image:
        description: "source=local only: image already present on the runner"
        required: false
        default: myllmbox/qwen38-flash-next-cluster-vllm:v6-spinfix
      tag:
        description: "ghcr tag to publish"
        required: false
        default: v6-spinfix
      base_image:
        description: "source=rebuild only: public base image"
        required: false
        default: myllmbox/qwen38-flash-next-cluster-vllm:v6

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # NB: the label list must be a real array, not a string that looks like one,
    # hence fromJSON. A plain "['self-hosted', 'linux', 'arm64']" string makes
    # GitHub reject the whole workflow file as invalid.
    runs-on: ${{ inputs.source == 'local' && fromJSON('["self-hosted","linux","arm64"]') || 'ubuntu-24.04-arm' }}
    env:
      # Docker requires fully lowercase repository paths, but the GitHub owner is
      # "TysAIs". ghcr namespaces are case-insensitive, so lowercase the path.
      # Every step below uses $IMAGE_REF, never ${{ github.repository_owner }}
      # spliced directly into a reference.
      IMAGE_REF: ghcr.io/tysais/qwen38-flash-next-cluster-vllm:${{ inputs.tag }}
    steps:
      - name: Log in to ghcr with the automatic GITHUB_TOKEN
        # No PAT required. GITHUB_TOKEN is scoped to this repo and can write
        # packages owned by TysAIs. It is masked in logs and expires with the job.
        # NB: do not `docker logout` here. The login writes to the runner's
        # ~/.docker/config.json, and logging out in the same step deletes the
        # credential the later push depends on ("User cannot be authenticated").
        # Log out in a trailing always() step instead.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Build from source over the public base
        if: inputs.source == 'rebuild'
        run: |
          set -euo pipefail
          docker build \
            --build-arg MBX_BASE="${{ inputs.base_image }}" \
            -t "$IMAGE_REF" \
            -f docker/spinfix/Dockerfile \
            .

      - name: Report provenance
        id: prov
        run: |
          set -euo pipefail
          REF="$IMAGE_REF"
          if [ "${{ inputs.source }}" = "local" ]; then
            SRC="${{ inputs.local_image }}"
            docker tag "$SRC" "$REF"
            echo "source=tagged-existing"        >> "$GITHUB_OUTPUT"
          else
            echo "source=built-from-source"      >> "$GITHUB_OUTPUT"
          fi
          echo "image_id=$(docker image inspect --format '{{.Id}}' "$REF")" >> "$GITHUB_OUTPUT"
          echo "arch=$(docker image inspect --format '{{.Architecture}}' "$REF")"   >> "$GITHUB_OUTPUT"
          # Assert the fix is actually present before publishing it.
          docker run --rm --entrypoint sh "$REF" -c \
            "grep -q 'busy_loop_s: float = 0.002,' /usr/local/lib/python3.12/dist-packages/vllm/distributed/device_communicators/shm_broadcast.py" \
            || { echo "::error::spinfix assertion failed - refusing to publish"; exit 1; }
          echo "spinfix_assert=pass" >> "$GITHUB_OUTPUT"

      - name: Push to ghcr
        # Skip when this exact tag is already in the registry with the same
        # digest we hold locally. Re-publishing a 10 GB image just to change
        # package visibility wastes ~8 minutes and the runner's disk.
        run: |
          set -euo pipefail
          local_digest=$(docker image inspect --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{end}}{{.Id}}' "$IMAGE_REF")
          remote_digest=$(curl -s -m 20 -o /dev/null -D - \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/tysais/qwen38-flash-next-cluster-vllm/manifests/${{ inputs.tag }}" \
            | grep -i '^docker-content-digest' | tr -d '\r' | awk '{print $2}' || true)
          if [ -n "$remote_digest" ]; then
            echo "tag already published: $remote_digest"
            echo "push=skipped-existing" >> "$GITHUB_OUTPUT"
          else
            docker push "$IMAGE_REF"
            echo "push=pushed" >> "$GITHUB_OUTPUT"
          fi
        id: pushstep

      - name: Make the package public
        # A package first published by GITHUB_TOKEN defaults to private, which
        # would defeat the whole point (anonymous pull on other boxes). This uses
        # the same automatic token -- still no PAT. Public repo + public package
        # is what we want here: the image holds no secrets, only a public base
        # plus a one-line patch.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PKG: qwen38-flash-next-cluster-vllm
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/vis.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GHCR_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/$OWNER/actions/packages/$PKG/visibility" \
            || true)
          if [ "$code" = "200" ]; then
            echo "package visibility -> public"
          else
            # Not an org, or endpoint unavailable to this token. Try the user
            # endpoint, then fall back to reporting the current visibility.
            code2=$(curl -s -o /tmp/vis2.json -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer $GHCR_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/$OWNER/packages/container/$PKG/visibility" \
              || true)
            if [ "$code2" = "200" ]; then
              echo "package visibility -> public (user endpoint)"
            else
              echo "::warning::could not set visibility automatically (org=$code user=$code2)"
              cat /tmp/vis.json /tmp/vis2.json 2>/dev/null | head -c 300 || true
            fi
          fi

      - name: Summary
        run: |
          {
            echo "### Published v6-spinfix to ghcr"
            echo ""
            echo "- image: \`$IMAGE_REF\`"
            echo "- source: \`${{ steps.prov.outputs.source }}\`"
            echo "- image id: \`${{ steps.prov.outputs.image_id }}\`"
            echo "- arch: \`${{ steps.prov.outputs.arch }}\`"
            echo "- spinfix assertion: \`${{ steps.prov.outputs.spinfix_assert }}\`"
            echo ""
            echo "Pull it with:"
            echo '```'
            echo "docker pull $IMAGE_REF"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of ghcr
        # MUST be the last step. docker login writes the credential to the
        # runner's ~/.docker/config.json and docker logout deletes it, so this
        # has to run AFTER the push. `if: always()` means "run even if an earlier
        # step failed" -- it does not move the step later in the job.
        if: always()
        run: docker logout ghcr.io || true